name: build

on:
  push:
    branches: [main]
  pull_requests:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build and test
        run: ./gradlew build --console=plain
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Build standalone jar
        run: ./gradlew fatJar --console=plain

      - name: Upload fat jar
        uses: actions/upload-artifact@v4
        with:
          name: mcdecompiler-all
          path: build/libs/mcdecompiler-all.jar
